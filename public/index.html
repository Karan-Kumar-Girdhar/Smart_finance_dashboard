<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Bank Statement Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>Financial <span class="highlight">Aanalyser</span></h1>
            <p>Upload your CSV bank statements for intelligent financial insights.</p>
        </header>

        <section class="upload-section glass-panel">
            <div id="drop-zone" class="drop-zone">
                <div class="upload-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <h3>Drag & Drop your CSV or Excel file here</h3>
                <p>or</p>
                <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden>
                <button class="btn primary-btn" onclick="document.getElementById('file-input').click()">Browse Files</button>
            </div>
            <div id="upload-status" class="status-message"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
